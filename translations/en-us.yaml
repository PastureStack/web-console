##############################
# Resource Actions
##############################
validation:
  required: '"{key}" is required'
  arrayLength:
    exactly: '"{key}" should contain {count, plural, =1 {# item} other {# items}}'
    between: '"{key}" should contain between {min} and {max} {max, plural, =1 {item} other {items}}'
    min: '"{key}" should contain at least {count} {count, plural, =1 {item} other {items}}'
    max: '"{key}" should contain at most {count} {count, plural, =1 {item} other {items}}'
  stringLength:
    exactly: '"{key}" should be {count, plural, =1 {# character} other {# characters}}'
    between: '"{key}" should be between {min} and {max} {max, plural, =1 {character} other {characters}}'
    min: '"{key}" should be at least {count} {count, plural, =1 {character} other {characters}}'
    max: '"{key}" should be at most {count} {count, plural, =1 {character} other {characters}}'
  number:
    exactly: '"{key}" should be exactly {val}'
    between: '"{key}" should be between {min} and {max}'
    min: '"{key}" should be at least {val}'
    max: '"{key}" should be at most {val}'
  chars: '"{key}" contains {count, plural, =1 {an invalid character} other {# invalid characters}}: {chars}'

##############################
# Model Properties
##############################
model:
  account:
    kind:
      registeredAgent: Registered Agent
      agent: Agent
      service: Service
      user: User
      admin: Admin
      project: Environment
  identity:
    displayType:
      user: User
      team: Team
      group: Group
      org: Organization
      localUser: Local User
      unknown: "{type}?"
  openldapconfig:
    server:
      label: Hostname or IP Address
    serviceAccountUsername:
      label: Service Account Username
    serviceAccountPassword:
      label: Service Account Password
    domain:
      label: User Search Base
      placeholder: "e.g. ou=Users,dc=mycompany,dc=com"
      help: "Only users below this base will be used."
  projectMember:
    role:
      member: Member
      owner: Owner
      readonly: Read-Only
      restricted: Restricted
  scaleService:
    min: Minimum Scale
    max: Maximum Scale
    amount: By

consoleWorkspace:
  dock:
    label: Console workspace
    sessions: 'Sessions ({count})'
    empty: No terminal or log sessions yet.
  context:
    title: '[{environment}][{stack}] {resource}'
    noStack: Unassigned stack
  session:
    terminal: Terminal
    logs: Logs
    vm: Virtual machine console
    status:
      new: Ready to start
      initializing: Initializing
      connecting: Connecting
      connected: Connected
      disconnected: Disconnected
      closing: Ending
      ended: Ended
      error: Error
    confirmTerminateTitle: End session?
    confirmTerminate: The running command will stop immediately, and retained output will no longer be available. Do you want to continue?
    removeHistory: Remove from session history
    loadError: The resource for this session could not be loaded.
    controller: This browser tab has input control.
    takeControl: Take input control
  window:
    terminate: End session
    minimize: Minimize
    restore: Restore
    maximize: Maximize
    close: Close window
    resize: Resize window
    reconnect: Reconnect
  launch:
    description: Terminal sessions open in movable windows and remain available after refreshing or closing the browser.
    button: Open terminal
    newButton: Open new session
