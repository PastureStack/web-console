authPage:
  mfa:
    navigation: Multi-factor authentication
    header: Multi-factor authentication
    account: Account
    manageAccounts: System sign-in security
    manageAccount: 'Manage MFA for {account}'
    managedAccountWarning: You are managing another account. For security, an administrator can inspect and revoke factors but cannot register a new factor, verify a recovery address, or obtain recovery codes for the account holder.
    accountManagement:
      header: Account security administration
      help: Select an account to inspect or revoke its sign-in factors. This selection does not change the system-wide policy or outgoing-email settings above.
    sessionRevoked: Active sessions for this account were revoked as part of the security change. Sign in again to continue.
    signInAgain: Sign in again
    selfService:
      navigation: Sign-in security
      header: My sign-in security
      help: Register and maintain your own authentication factors and account-recovery methods. Security changes may require you to sign in again.
      manageMine: Manage my MFA
    summary:
      totp: Authenticator apps
      passkeys: Passkeys
      recoveryCodes: Recovery codes
      policy: Enrollment policy
      required: Required
      optional: Optional
    recoveryCodes:
      header: Recovery codes
      oneTimeHelp: Save these single-use codes now. They cannot be displayed again.
      copy: Copy codes
      saved: I saved the codes
      help: Recovery codes provide emergency access when another registered factor is unavailable.
      regenerate: Generate new recovery codes
      confirm: Existing recovery codes will stop working. Generate a new set?
      requiresFactor: Register an authenticator app or passkey before generating recovery codes.
    factor:
      header: Registered authentication factors
      type: Type
      label: Name
      created: Registered
      lastUsed: Last used
      none: No authentication factors are registered for this account.
      types:
        totp: Authenticator app
        passkey: Passkey
      confirmRevoke: 'Remove "{label}"?'
      confirmRevokeAll: Remove every authentication factor and recovery method from this account?
    totp:
      header: Authenticator app
      scanHelp: Scan this QR code with an authenticator app, or enter the secret manually, then verify a current 6-digit code.
      qrAlt: QR code for authenticator app enrollment
      manualSecret: Manual setup secret
      defaultLabel: Authenticator app
      code: 6-digit code
      confirm: Verify and register
      help: Register an RFC 6238-compatible app such as Google Authenticator or Microsoft Authenticator.
      add: Register authenticator app
      openAuthenticator: Open in authenticator app
    passkey:
      header: Passkeys
      help: Register Windows Hello, a phone, or a hardware security key. A passkey requires HTTPS, except on localhost.
      defaultLabel: Passkey
      add: Register passkey
      notConfigured: Configure an HTTPS origin and relying-party ID before registering passkeys.
      secureContextRequired: This browser can register a passkey only over HTTPS, except when the console is opened on localhost.
    email:
      header: My recovery email address
      help: Verify the destination address used to recover only this account. It is not accepted as a multi-factor authentication factor.
      systemManaged: The system administrator configures one shared outgoing-email service. No SMTP server, sender, or password is stored in your account.
      verified: 'Verified recovery address: {email}'
      revoke: Remove recovery email
      sent: 'A 6-digit verification code was sent to {email}.'
      code: 6-digit verification code
      confirm: Verify address
      placeholder: name@example.com
      verify: Send verification code
      confirmRevoke: Remove the verified recovery email address?
      notConfigured: Email recovery is unavailable until a system administrator configures SMTP delivery.
    securityConfirmation:
      header: Confirm this security change
      help: Use one of your existing authentication factors. This short confirmation is valid for one security operation only.
      secureContextRequired: Passkeys are unavailable on this connection because they require HTTPS or localhost. Use another listed method or reconnect over HTTPS.
      confirm: Confirm and continue
      error: The security confirmation could not be completed.
    settings:
      header: System-wide sign-in security
      scopeHelp: These settings apply to every account in this PastureStack installation and can be changed only by a system administrator.
      localRecoveryReady: Local administrator emergency sign-in is retained. It remains available if single sign-on or the Authentication Service is unreachable and still requires platform MFA.
      localRecoveryBlocked: External authentication is not safe to use because no verified local administrator recovery path is available.
      enforcement: Enrollment requirement
      optional: Optional for all accounts
      requiredAdmins: Required for system administrators
      requiredAll: Required for all interactive accounts
      passkeyLimit: Passkeys allowed per account
      issuer: Authenticator issuer name
      webAuthn: Passkey settings
      rpName: Relying-party display name
      rpId: Relying-party ID
      rpIdPlaceholder: console.example.com
      origin: Exact console origin
      originPlaceholder: https://console.example.com
      webAuthnHelp: The relying-party ID must match the console host and cannot be a public suffix. Use an exact HTTPS origin in production; plain HTTP is allowed only on localhost.
      passkeyCounterPolicy: Passkey counter handling
      passkeyCounterRiskAware: Allow synchronized passkeys and record counter anomalies
      passkeyCounterStrict: Reject every non-increasing passkey counter
      passkeyCounterHelp: Risk-aware mode accepts a valid user-verified synchronized passkey when its shared counter does not advance, and records the anomaly. Non-synchronized credentials are still rejected.
      verificationProtection: Verification-attempt protection
      maximumFailedAttempts: Failed attempts before temporary lock
      lockoutSeconds: Temporary lock duration in seconds
      securityConfirmationTtlSeconds: Security-confirmation lifetime in seconds
      verificationProtectionHelp: Failed attempts are counted for the account, not the browser challenge. Starting another sign-in does not reset the counter.
      federatedMfa: Single sign-on MFA responsibility
      federatedMfaMode: MFA handling after OIDC
      federatedPlatform: Always verify again with PastureStack
      federatedTrustedClaims: Trust verified OIDC MFA claims
      maximumFederatedAuthenticationAgeSeconds: Maximum upstream MFA age in seconds
      trustedAuthenticationMethods: Trusted amr values (comma-separated)
      trustedAuthenticationMethodsPlaceholder: mfa, otp, hwk, webauthn
      trustedAuthenticationContexts: Trusted acr values (comma-separated, optional)
      federatedMfaWarning: Trust OIDC claims only when the identity provider reliably signs amr, acr, and auth_time. Local emergency administrator sign-in always requires PastureStack MFA.
      smtp: System-wide outgoing email (SMTP)
      smtpHelp: Configure the outgoing-email service once for the entire installation. Individual accounts store only their own verified recovery destination address.
      smtpEnabled: Enable shared SMTP delivery for account recovery
      smtpHost: SMTP server
      smtpPort: Port
      smtpUsername: Username
      smtpPassword: Password
      smtpClearPassword: Remove the saved SMTP password
      smtpFrom: Sender address
      startTls: Upgrade the connection with STARTTLS
      implicitTls: Use implicit TLS
      codeTtl: Code lifetime in seconds
      testRecipient: Test recipient
      saveAndTest: Save and send test email
      securityEmailLocale: Security-email language
      localeTraditionalChinese: Traditional Chinese (Taiwan)
      localeEnglish: English
    danger:
      header: Remove all recovery access
      help: This removes every authenticator app, passkey, recovery code, and verified recovery email from the selected account.
      revokeAll: Remove all factors and recovery methods
    error:
      generic: The multi-factor authentication request could not be completed.
      secureContext: Passkeys require HTTPS, except when using localhost.
  oidc:
    defaultProviderName: OpenID Connect
    localRecovery:
      header: Verify emergency local administrator sign-in
      help: Before activation, enter an existing local system-administrator account that already has an authenticator app or passkey. PastureStack verifies it immediately and accepts the result for five minutes only. The password is not stored in the OIDC configuration.
      username: Local administrator username
      password: Local administrator password
      errors:
        credentialsRequired: Enter an existing local system-administrator username and password.
        invalidAdministrator: The supplied credentials do not belong to an active local system administrator.
        mfaRequired: Register an authenticator app or passkey for the local system administrator before activating OpenID Connect.
    status:
      enabled: "{providerName} is enabled"
      disabled: OpenID Connect is not configured
      enabledHelp: "{appName} uses {providerName} for sign-in. The access list currently contains {users} users and {groups} groups."
      disabledHelp: "{appName} can use any standards-compliant OpenID Connect provider for sign-in."
    registration:
      header: 1. Register an OpenID Connect client
      help: Register this installation as a confidential web client with your identity provider. Use the exact redirect URI shown below.
      callbackUrl:
        label: Redirect URI
        help: The external platform URL must be stable and use HTTPS in production.
    form:
      header: 2. Configure the OpenID Connect provider
      help: Provider endpoints and signing keys are obtained from the discovery document. Authorization, token, and JWKS endpoints cannot be overridden here.
      displayName:
        label: Provider display name
        placeholder: Company single sign-on
        help: This name is shown on the sign-in page. It does not change the protocol.
      wellKnownUrl:
        label: Discovery document URL
        placeholder: https://id.example.com/.well-known/openid-configuration
        help: The full URL ending in .well-known/openid-configuration.
      clientId:
        label: Client ID
      clientSecret:
        label: Client secret
        help: The secret is encrypted at rest when the provider is enabled and is never shown again.
        unchanged: Saved secret remains unchanged
      scopes:
        label: Scopes
        placeholder: openid profile email
        help: Space-separated scopes. The required openid scope cannot be removed.
      pkce:
        label: Use PKCE with the S256 method
        help: Recommended for modern providers. Disable only when a trusted legacy provider does not support PKCE.
      advanced:
        show: Show advanced claim and certificate settings
        hide: Hide advanced settings
      claims:
        header: Claim mapping
        help: Map standard or custom ID token claims without tying the platform to a specific identity provider.
      subjectClaim:
        label: Stable subject claim
        value: sub
        help: OIDC requires sub. It is combined with the issuer to form the platform identity and cannot be changed.
      usernameClaim:
        label: Username claim
        placeholder: preferred_username
      displayNameClaim:
        label: Display name claim
        placeholder: name
      emailClaim:
        label: Email claim
        placeholder: email
      groupsClaim:
        label: Groups claim
        placeholder: groups
        help: Optional. Leave blank when the provider does not include groups in the ID token.
      certificateAuthority:
        label: Trusted CA certificate
        placeholder: '-----BEGIN CERTIFICATE-----'
        help: Optional PEM certificate for a privately issued provider certificate. TLS verification is never disabled.
      save: Validate configuration
    validation:
      displayName: Provider display name is required.
      wellKnownUrl: Discovery document URL is required.
      invalidUrl: Discovery document URL is invalid.
      https: Discovery must use HTTPS except for local development.
      clientId: Client ID is required.
      clientSecret: Client secret is required.
      openidScope: Scopes must include openid.
      userIdentity: The identity provider did not return a usable user identity.
    test:
      header: 3. Test and enable authentication
      help: "Test a real sign-in through {providerName}. This does not change the active authentication method."
      action: "Test sign-in with {providerName}"
      waiting: Waiting for the identity provider
      success: "The test sign-in for {identity} through {providerName} succeeded."
      activateHelp: "To prevent authorization-code reuse, enabling {providerName} requests one fresh sign-in and then creates the normal platform session."
      again: Test again
      activateAction: "Enable {providerName} and sign in"
      activating: Enabling and signing in
      activationRolledBack: "The final sign-in failed ({error}). The previous authentication configuration was restored; the existing administrator session was kept."
      activationRollbackFailed: "The final sign-in failed ({activationError}), and automatic recovery also failed ({rollbackError}). Keep this page open and use the existing administrator session to disable OIDC."
    identity:
      header: Link the verified identity to a platform account
      help: Accounts hold permissions; login identities only prove who is signing in. Username and email are never used for automatic matching.
      verifiedLogin: Verified login
      subject: Stable OIDC subject
      currentMatch: Current account link
      noMatch: Not linked to a platform account
      inactiveMatch: 'The linked account "{account}" is disabled. Restore it to keep the account and all of its existing permissions.'
      restore: Restore this account
      restoring: Restoring account
      strategyLabel: Identity assignment
      useExisting: Keep the existing account link
      reassign: Reassign this identity
      targetAccount: Target platform account
      targetHelp: The target keeps its platform account and permissions. Passwords, API keys, sessions, and personal credentials are never copied.
      transferPermissions: Copy the old account's direct environment roles and system-administrator role
      transferHelp: Roles are merged without reducing any permission already held by the target.
      oldAccountDisposition: After reassignment, handle the old account as
      confirmationHeader: Confirm the account and permission change
      confirmationSummary: 'Move this verified identity from "{source}" to "{target}" using the permission and old-account choices above.'
      confirm: Confirm this exact change
      confirmed: This exact account and permission change is confirmed.
      disposition:
        keep: Keep the old account active
        disable: Disable the old account and revoke its sessions
        discard: Remove its direct permissions, disable it, and revoke its sessions
      securityNotice: Security stays enabled throughout the switch. A two-minute, single-use recovery ticket restores the previous provider if the final sign-in fails.
      managementSecurityNotice: The signed identity proof is single-use. The platform applies only the explicit account and permission choices shown above; username and email are never matching keys.
      activeAdminRequired: Select an active system-administrator account before continuing.
      activeAccountRequired: Select an active platform account before continuing.
      managementHeader: Sign-in identity assignments
      managementHelp: Verify the external identity again before linking it to a different platform account or moving its direct permissions.
      managementAction: Verify an identity to manage its assignment
      managementSuccess: The identity assignment and selected permission changes were applied.
      apply: Apply identity assignment
      applying: Applying identity assignment
      missingProof: The provider did not return a signed identity proof. Run the test again after updating the authentication service.
      missingSwitchTicket: The platform did not return a provider-switch recovery ticket.
    summary:
      header: OpenID Connect configuration
    switch:
      header: Change the primary sign-in provider
      help: Restore local accounts only after verifying an existing local system administrator. Access control is never turned off during this change.
      local: Switch safely to local accounts
    disable:
      header: "Danger Zone&trade;"
      warning: '<b class="text-danger">Caution:</b> Disabling access control gives complete control of {appName} to anyone who can reach this page or the API.'
      confirm: Are you sure? Click again to disable access control
      action: Disable access control
